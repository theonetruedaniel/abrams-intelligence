name: Offline dispatcher demo

on:
  push:
    branches: [main]
    paths:
      - 'tools/development-dispatcher/**'
      - '.github/workflows/offline-demo.yml'
  pull_request:
    paths:
      - 'tools/development-dispatcher/**'
      - '.github/workflows/offline-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-demo:
    name: Offline demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/development-dispatcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run five synthetic preview scenarios
        run: python -m scripts.dispatch.demo
      - name: Verify preview behavior and no network or child processes
        run: python -m unittest discover -s tests/dispatch -p test_demo.py -v
